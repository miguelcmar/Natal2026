<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Admin · Natal</title>
<style>
:root{--red:#b3262e;--green:#1f5a3f;--cream:#fbf6ee;--ink:#2a2420;--muted:#7a6f66;--card:#fff;--line:#eadfce}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.4}
header{background:var(--green);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:1.3rem}
main{max-width:760px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:#fff;font-weight:600}
button.sec{background:var(--green)}
button.ghost{background:transparent;color:var(--muted);font-weight:400;text-decoration:underline;padding:4px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
.row>button{flex:0 0 auto}
.msg{font-size:.9rem;min-height:1.2em;margin-top:8px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}
.hint{background:#fff4d6;border:1px solid #f0dca0;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:10px}
.preview{margin-top:10px;max-height:160px;max-width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img,.item .ph{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#f2ebdf;flex:0 0 56px;display:flex;align-items:center;justify-content:center}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:.85rem;color:var(--muted)}
.hidden{display:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(30,24,18,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.sheet{background:#fff;border-radius:16px;padding:22px 20px 16px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h3{margin:0 0 6px;font-size:1.1rem}
.sheet p{margin:0;color:var(--muted);white-space:pre-line;max-height:50vh;overflow:auto}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.m-actions .no{background:#f1e9db;color:var(--ink)}
</style>
</head>
<body>
<header><h1>🎄 Admin · Natal</h1></header>
<main>

<section id="denied" class="box hidden">
  <b>Sem acesso.</b>
  <p>Só o Miguel e a Natália podem editar. Abre a <a href="/">página principal</a> e escolhe o teu nome.</p>
</section>

<section id="app" class="hidden">
  <a href="/" style="color:var(--green);text-decoration:none">← Voltar às cartas</a><br>
  <b id="who"></b>
  <div class="hint">Aqui não aparece o estado das reservas, para manteres a surpresa. 🤫</div>

  <div class="box">
    <b id="formTitle">Nova prenda</b>
    <label for="link">Link da loja</label>
    <div class="row">
      <input id="link" type="url" inputmode="url" placeholder="https://...">
      <button class="sec" id="readBtn" type="button">Ler link</button>
    </div>
    <div class="msg" id="readMsg"></div>
    <label for="link2">Segundo link (opcional)</label>
    <input id="link2" type="url" inputmode="url" placeholder="https://...">

    <label for="title">Nome da prenda</label>
    <input id="title">
    <label for="image">Imagem (endereço da imagem)</label>
    <input id="image" type="url" inputmode="url">
    <img id="prev" class="preview hidden" alt="">
    <label for="note">Nota (tamanho, cor...)</label>
    <textarea id="note" rows="3"></textarea>
    <div class="msg" id="saveMsg"></div>
    <div class="row" style="margin-top:8px">
      <button id="saveBtn" type="button">Guardar prenda</button>
      <button class="ghost" id="cancelBtn" type="button" style="flex:0 0 auto">limpar</button>
    </div>
  </div>

  <div class="box">
    <b>A minha lista</b>
    <div id="list"></div>
  </div>
</section>
</main>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="m-actions">
      <button class="no" id="mNo" type="button">Cancelar</button>
      <button id="mYes" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://stonleipysdlaprwowec.supabase.co';
const SB_KEY = 'sb_publishable_UqaAv23czfi1xo9OiiB-IA_d0-0Hbwa';
const NAMES = { miguel: 'Miguel', natalia: 'Natália' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = '', owner = null, items = [], editingId = null;

function ask(title, text, okLabel = 'Confirmar') {
  return new Promise(resolve => {
    const m = $('modal'), yes = $('mYes'), no = $('mNo');
    $('mTitle').textContent = title; $('mText').textContent = text || ''; yes.textContent = okLabel;
    m.hidden = false; no.focus();
    const done = v => { m.hidden = true; yes.onclick = no.onclick = m.onclick = null; document.removeEventListener('keydown', key); resolve(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    yes.onclick = () => done(true); no.onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.addEventListener('keydown', key);
  });
}

const store = {
  get() { try { return localStorage.getItem('natal_viewer') || ''; } catch { return ''; } }
};

async function rpc(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) { const e = new Error('rpc'); e.status = r.status; throw e; }
  return r.json();
}
function say(id, text, cls = '') { const el = $(id); el.textContent = text; el.className = 'msg ' + cls; }

async function start() {
  // a identidade e a que a pessoa escolheu na pagina principal
  token = store.get();
  if (!token) return $('denied').classList.remove('hidden');
  try { owner = await rpc('admin_whoami', { p_token: token }); }
  catch { return $('denied').classList.remove('hidden'); }
  $('who').textContent = 'Lista ' + (owner === 'natalia' ? 'da ' : 'do ') + (NAMES[owner] || owner);
  $('app').classList.remove('hidden');
  loadItems();
}

async function loadItems() {
  try { items = await rpc('admin_list', { p_token: token }); }
  catch { return say('saveMsg', 'Erro ao carregar a lista.', 'err'); }
  $('list').innerHTML = items.length ? items.map(i => `
    <div class="item">
      ${i.image_url ? `<img src="${esc(i.image_url)}" alt="" referrerpolicy="no-referrer">` : '<div class="ph">🎁</div>'}
      <div class="t"><b>${esc(i.title)}</b><span></span></div>
      <button class="ghost" data-edit="${i.id}">editar</button>
      <button class="ghost" data-del="${i.id}">apagar</button>
    </div>`).join('') : '<p style="color:var(--muted)">Ainda sem prendas.</p>';
}

$('list').addEventListener('click', async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const i = items.find(x => x.id === ed);
    editingId = i.id;
    $('formTitle').textContent = 'Editar prenda';
    $('link').value = i.url || ''; $('link2').value = i.url2 || ''; $('title').value = i.title || ''; $('image').value = i.image_url || '';
    $('note').value = i.note || '';
    showPrev(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (del && await ask('Apagar esta prenda?', 'Esta ação não pode ser desfeita.', 'Apagar')) {
    try { await rpc('admin_delete', { p_token: token, p_id: del }); loadItems(); }
    catch { say('saveMsg', 'Erro ao apagar.', 'err'); }
  }
});

function showPrev() {
  const v = $('image').value.trim();
  if (v) { $('prev').src = v; $('prev').classList.remove('hidden'); } else $('prev').classList.add('hidden');
}
$('image').oninput = showPrev;

function clearForm() {
  editingId = null;
  $('formTitle').textContent = 'Nova prenda';
  for (const id of ['link', 'link2', 'title', 'image', 'note']) $(id).value = '';
  showPrev(); say('readMsg', ''); say('saveMsg', '');
}
$('cancelBtn').onclick = clearForm;

$('readBtn').onclick = async () => {
  const link = $('link').value.trim();
  if (!link) return say('readMsg', 'Cola primeiro o link da loja.', 'err');
  say('readMsg', 'A ler o link...');
  $('readBtn').disabled = true;
  try {
    const r = await fetch('/api/preview?url=' + encodeURIComponent(link), {
      headers: { 'X-Admin-Token': token }
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'erro');
    if (d.title) $('title').value = d.title;
    if (d.image) $('image').value = d.image;
    if (d.url) $('link').value = d.url;
    showPrev();
    const missing = ['title', 'image'].filter(k => !d[k]);
    say('readMsg', missing.length
      ? 'Li o que consegui. Falta preencher: ' + missing.map(k => ({ title: 'nome', image: 'imagem', price: 'preço' }[k])).join(', ') + '.'
      : 'Pronto! Confirma os dados e guarda.', missing.length ? '' : 'ok');
  } catch {
    say('readMsg', 'Não consegui ler este link. Preenche à mão.', 'err');
  }
  $('readBtn').disabled = false;
};


$('saveBtn').onclick = async () => {
  const title = $('title').value.trim();
  if (!title) return say('saveMsg', 'Falta o nome da prenda.', 'err');
  if (!await ask(editingId ? 'Guardar as alterações?' : 'Adicionar esta prenda?', `«${title}»`, editingId ? 'Guardar' : 'Adicionar')) return;
  $('saveBtn').disabled = true;
  try {
    await rpc('admin_save', {
      p_token: token, p_id: editingId, p_title: title, p_url: $('link').value, p_url2: $('link2').value, p_image: $('image').value,
      p_price: '', p_note: $('note').value, p_priority: 0, p_quantity: 1
    });
    clearForm(); say('saveMsg', 'Guardado ✓', 'ok'); loadItems();
  } catch { say('saveMsg', 'Erro ao guardar.', 'err'); }
  $('saveBtn').disabled = false;
};

start();
</script>
</body>
</html>
