<style>
:root{
  --night:#0c2a20; --night-2:#123a2b; --red-christmas:#c0392b;
  --cream:#fbf6ee; --paper:#fffdf8; --ink:#2b2622; --muted:#85796e;
  --red:#b8433a; --red-d:#9c342c; --green:#1f5a3f; --gold:#d9b779; --line:rgba(255,255,255,.14);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{
  margin:0; min-height:100vh; color:var(--cream); font-family:var(--sans); line-height:1.45;
  background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%) fixed;
  -webkit-font-smoothing:antialiased;
}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:90;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.sleigh{position:absolute;top:6px;left:0;width:100%;height:110px;overflow:hidden;pointer-events:none;z-index:5}
.sleigh .bob{position:absolute;top:0;left:0;animation:fly 12s linear infinite;will-change:transform}
.sleigh svg{display:block;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
@keyframes fly{0%{transform:translateX(100vw)}85%,100%{transform:translateX(-360px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(8px) rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.sleigh{display:none}}
header{text-align:center;padding:96px 20px 18px}
.star{color:var(--gold);font-size:1.1rem;letter-spacing:.6em;margin-right:-.6em}
header h1{font-family:'Dancing Script','Segoe Script',cursive;font-weight:700;font-size:clamp(3.6rem,17vw,6rem);line-height:1;margin:10px 0 0;letter-spacing:0}
header p{font-family:'Dancing Script','Segoe Script',cursive;font-weight:600;margin:10px 0 0;color:var(--gold);font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.1;letter-spacing:.01em}
.rule{width:56px;height:1px;background:var(--gold);margin:22px auto 0;opacity:.7}

main{max-width:940px;margin:0 auto;padding:8px 18px 90px;position:relative;z-index:1}

/* escolher quem es */
.box{background:var(--paper);color:var(--ink);border-radius:20px;padding:28px 22px;max-width:400px;margin:28px auto;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.box h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;color:var(--ink)}
.box .small{color:var(--muted)}
.who{display:flex;flex-direction:column;gap:10px;margin-top:18px}

button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 18px;background:var(--red);color:#fff;font-weight:600;transition:background .15s,transform .05s}
button:hover{background:var(--red-d)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
button.choice{background:#fff;color:var(--ink);border:1px solid #e6dccb;font-weight:500;font-size:1.02rem}
button.choice:hover{background:#f6efe3;border-color:var(--gold)}
button.ghost{background:transparent;color:inherit;font-weight:400;text-decoration:underline;padding:4px 6px;opacity:.75}
button.ghost:hover{background:transparent;opacity:1}
button.soft{background:#e7f0e9;color:var(--green)}
button.soft:hover{background:#d8e8dc}

.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:rgba(251,246,238,.6);margin:6px 0 0}
.top button.ghost{color:rgba(251,246,238,.8)}
.top .edit{color:var(--gold);text-decoration:none;font-weight:600;margin-right:12px}

/* boas-vindas */
.welcome{width:100%;margin:20px 0 0;text-align:center;border:1px solid rgba(217,183,121,.35);background:rgba(0,0,0,.18);color:var(--cream);border-radius:22px;padding:24px 22px}
.welcome .emoji{font-size:2rem;line-height:1}
.welcome h2{color:var(--gold);font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem,5vw,1.8rem);margin:10px 0 8px}
.wsep{border:0;border-top:1px solid rgba(217,183,121,.45);margin:16px auto;width:60%}
.welcome .wish{font-size:.98rem;line-height:1.55}
.welcome .sign{margin-top:12px;color:var(--gold)}
.how{width:100%;margin:36px 0 12px;border:1px solid rgba(217,183,121,.35);background:rgba(0,0,0,.18);border-radius:22px;padding:20px 22px}
.foot{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 24px;font-size:.78rem;opacity:.55}
.foot a{color:inherit}
.foot button{color:inherit;font-size:inherit;padding:0}
.foot:hover{opacity:.9}
.how h3{color:var(--gold);font-family:var(--serif);margin:0 0 10px;font-size:1.2rem;text-align:center}
.how ul{margin:0;padding-left:20px;color:rgba(251,246,238,.88);font-size:.95rem;line-height:1.5}
.how li{margin:5px 0}
.how li::marker{color:#e0675a}
.how .anon{text-align:center;margin:14px 0 0;color:var(--gold);font-weight:600}
.welcome p{margin:0;color:var(--cream);font-size:1.02rem}

/* separadores */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 0}
.tab{background:transparent;color:rgba(251,246,238,.75);border:1px solid var(--line);padding:9px 15px;font-weight:500;font-size:.92rem}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.on:hover{background:var(--red-d)}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--gold);color:#2b2316;font-size:.78rem;line-height:20px}

/* filtro de preco */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;margin:20px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line);padding:8px 14px;font-weight:500;font-size:.9rem}
.chip:hover{background:rgba(255,255,255,.16)}
.chip.on{background:var(--gold);color:#2b2316;border-color:var(--gold)}
.chip.free{border-color:rgba(217,183,121,.65);margin-right:6px}
.sort{font-size:.85rem;color:rgba(251,246,238,.7);display:flex;align-items:center;gap:8px}
.sort select{font:inherit;background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.sort select option{color:#222}

h2.list-title{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,5vw,2rem);margin:44px 0 6px;text-align:center}
h2.list-title::after{content:"";display:block;width:36px;height:1px;background:var(--gold);margin:14px auto 0;opacity:.7}
.note{max-width:460px;margin:14px auto 4px;text-align:center;font-size:.9rem;color:rgba(251,246,238,.75);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.05)}
.empty{text-align:center;color:rgba(251,246,238,.6);margin:18px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:22px}
.card{background:var(--paper);color:var(--ink);border-top:3px solid var(--gold);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.card.done .img img{opacity:.38;filter:grayscale(.6)}
.card.done .img{background:#f3ede2}
.stamp{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-13deg);
  padding:6px 18px;border:4px double var(--red);border-radius:8px;color:var(--red);background:rgba(255,253,248,.78);
  font-family:var(--sans);font-weight:800;font-size:1.15rem;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.12);pointer-events:none}
.stamp.mine{color:var(--green);border-color:var(--green)}
.img{position:relative;aspect-ratio:4/5;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.4rem;border-bottom:1px solid #f0e8da}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.img img{transition:transform .35s ease}
@media (hover:hover){.card:hover .img img{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.img img{transition:none}}
.body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.25}
.small{font-size:.85rem}
.card .small{color:var(--muted)}
.badge{align-self:flex-start;font-size:.72rem;letter-spacing:.04em;background:#f6ead0;color:#7a5a1c;border-radius:999px;padding:3px 10px}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.actions a{color:var(--green);font-weight:600;font-size:.9rem;text-decoration:none}
.actions a:hover{text-decoration:underline}
.actions .row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.reserved{color:var(--green);font-weight:600;font-size:.95rem}
.card .ghost{color:var(--muted);font-size:.82rem}

/* janela de confirmacao */
.modal{position:fixed;inset:0;z-index:100;background:rgba(6,20,15,.6);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.sheet{background:var(--paper);color:var(--ink);border-radius:20px;padding:24px 22px 18px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0 0 8px}
.sheet p{margin:0;color:var(--muted)}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.m-actions .no{background:#f1e9db;color:var(--ink)}
.m-actions .no:hover{background:#e8dec9}
.m-actions .no[hidden]{display:none}

/* aviso */
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:90;max-width:min(420px,calc(100vw - 32px));background:var(--cream);color:var(--ink);border-radius:14px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.4);font-size:.92rem;text-align:center}
.toast[hidden]{display:none}


@media (prefers-reduced-motion: reduce){ button{transition:none} }
</style>
</head>

<header>

<script>
const SB_URL = 'https://stonleipysdlaprwowec.supabase.co';
const SB_KEY = 'sb_publishable_UqaAv23czfi1xo9OiiB-IA_d0-0Hbwa';
const NAMES = { miguel: 'Miguel', natalia: 'Natália' };
const app = document.getElementById('app');
const store = {
  get() { try { return localStorage.getItem('natal_viewer') || ''; } catch { return ''; } },
  set(v) { try { localStorage.setItem('natal_viewer', v); } catch {} },
  del() { try { localStorage.removeItem('natal_viewer'); } catch {} }
};

// link de emergencia para quem escolheu a pessoa errada: acrescentar ?reset ao endereco
if (new URLSearchParams(location.search).has('reset')) { store.del(); history.replaceState(null, '', location.pathname); }

let viewer = store.get();
let state = null;
let tab = null;        // 'natalia' | 'miguel' | 'mine'
let onlyFree = false;  // mostrar so as prendas ainda disponiveis
const seed = Math.random();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { if (!u) return ''; try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const $ = id => document.getElementById(id);


/* ---------- mensagens de boas-vindas ---------- */
const WELCOME = {
  'marco-rita': { name: 'Marco e Rita', msgs: [
    'O Pai Natal só deixa entrar quem se portou bem, e por milagre passaram na triagem. Escolham uma prenda, reservem, e o segredo fica entre nós. 🤫',
    'As renas estão de dieta, mas o Miguel e a Natália não: ainda pedem prendas! Vejam as cartas e reservem antes que o Pai Natal se adiante.',
    'Missão de Natal para o casal mais esperto da família: escolher uma prenda, reservar e fingir surpresa no dia 25. 🎁' ] },
  'cotas': { name: 'Mãe e Pai', msgs: [
    'Os duendes avisaram que a Mãe e o Pai são os melhores a escolher prendas. Sem pressão, mas a fasquia está altíssima! 😄',
    'Aqui ninguém precisa de embrulhar já. Escolham a prenda, carreguem em «Reservar» e o Pai Natal trata do resto.',
    'O Pai Natal está a contar convosco. Até mandou um email, mas foi parar ao spam. Por isso, venham ver as cartas! 📬' ] },
  'marta-nuno': { name: 'Marta e Nuno', msgs: [
    'O Pai Natal já tem as vossas caras no ficheiro dos «muito simpáticos». Aproveitem: escolham uma prenda e reservem.',
    'Aviso dos duendes: quem reserva cedo dorme descansado; quem fica para a última corre pelo centro comercial a 24 de dezembro. 🏃',
    'Bem-vindos à oficina do Pai Natal, versão digital! Os duendes trabalham de graça, mas só aceitam reservas anónimas. 🤫' ] },
  'natalia': { name: 'Natália', msgs: [
    'As renas confirmaram: a tua carta está impecável. Agora espreita a do Miguel e reserva a prenda antes que o Pai Natal se adiante. 🤫',
    'O Miguel jura que se portou bem este ano. Os duendes pedem provas, mas a decisão final é tua. 😅',
    'O que estiver reservado na tua carta é segredo de Estado. Quanto à do Miguel, vê à vontade.' ] },
  'miguel': { name: 'Miguel', msgs: [
    'Os duendes dizem que a tua carta já dava para um inventário. 😄 Agora espreita a da Natália e escolhe bem: ela repara em tudo!',
    'Regra de ouro: a tua carta é uma surpresa, por isso não vês o que já foi reservado. Resiste à curiosidade! 🤫' ] }
};
function welcomeHtml() {
  const w = WELCOME[viewer];
  const name = w ? w.name : '';
  const msg = w ? w.msgs[Math.floor(seed * w.msgs.length)] : 'Espreita as cartas e reserva uma prenda. O segredo fica entre nós. 🤫';
  return `<section class="welcome">
    <h2>Ho ho ho!</h2><p>${esc(msg)}</p>
    <hr class="wsep">
    <p class="wish">Neste Natal desejamos-vos uma mesa cheia, um sofá sempre com lugar e muito pouco trânsito no centro comercial. Que não falte chocolate quente, rabanadas (sem contar quantas) nem boa disposição, e que o Pai Natal vos traga tudo o que pediram, mesmo o que se portaram mal para merecer. 🎄✨</p>
    <p class="sign">Feliz Natal a todos! 🎁<br><b>Miguel &amp; Natália</b></p></section>`;
}

function howHtml() {
  return `<section class="how"><h3>Como funciona</h3><ul>
    <li>Abre a carta da <b>Natália</b> ou do <b>Miguel</b> e escolhe uma prenda.</li>
    <li>Carrega em <b>Reservar</b> e confirma. A prenda fica marcada para os outros.</li>
    <li>Enganaste-te? Em <b>As minhas reservas</b> podes desfazer a reserva.</li>
    <li>Usa «Só disponíveis» para esconder o que já foi reservado.</li>
    <li>O Miguel e a Natália não vêem o que foi reservado na sua própria carta.</li>
  </ul><p class="anon">🤫 Todas as reservas são anónimas.</p></section>
    <div class="foot">${state.viewer ? '<a class="edit" href="/admin.html">✎ Editar a minha carta</a><span>·</span>' : ''}<button class="ghost" id="refresh">atualizar</button></div>`;
}

function applyFilters(items) {
  return onlyFree ? items.filter(i => !i.reserved && !i.mine) : items;
}

/* ---------- janela de confirmacao / aviso ---------- */
function ask(title, text, okLabel = 'Confirmar', showCancel = true) {
  return new Promise(resolve => {
    const m = $('modal'), yes = $('mYes'), no = $('mNo');
    $('mTitle').textContent = title;
    $('mText').textContent = text || '';
    yes.textContent = okLabel;
    no.hidden = !showCancel;
    m.hidden = false; (showCancel ? no : yes).focus();
    const done = v => {
      m.hidden = true;
      yes.onclick = no.onclick = m.onclick = null; document.removeEventListener('keydown', key);
      resolve(v);
    };
    const key = e => { if (e.key === 'Escape') done(false); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    document.addEventListener('keydown', key);
  });
}
const tell = (title, text) => ask(title, text, 'Ok', false);

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 7000);
}

async function rpc(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) { const e = new Error('rpc'); e.status = r.status; throw e; }
  return r.json();
}

const offline = () => {
  app.innerHTML = `<div class="box"><p>Sem ligação.</p><button id="retry">Tentar outra vez</button></div>`;
  $('retry').onclick = () => (viewer ? load() : renderPicker());
};

async function renderPicker() {
  app.innerHTML = `<div class="box"><p class="small">A carregar…</p></div>`;
  let list;
  try { list = await rpc('get_viewers'); } catch { return offline(); }
  app.innerHTML = `
    <div class="box">
      <h2>Quem és tu?</h2>
      <p class="small">Escolhe o teu nome. Só perguntamos esta vez: fica guardado neste aparelho.</p>
      <div class="who">${list.map(v => `<button class="choice" data-pick="${esc(v.id)}">${esc(v.label)}</button>`).join('')}</div>
    </div>`;
}

/* avisa quando outra pessoa reservou, entretanto, uma prenda que estava livre */
function notifyTaken(prev, next) {
  for (const it of next.items) {
    const p = prev.items.find(x => x.id === it.id);
    if (p && !p.reserved && it.reserved && !it.mine && !it.own) {
      toast(`«${it.title}» acabou de ser reservada por outra pessoa.`);
      return;
    }
  }
}

async function load(silent = false) {
  try {
    const next = await rpc('get_lists', { p_viewer: viewer });
    const prev = state;
    state = next;
    if (prev) notifyTaken(prev, next);
    if (!silent || !prev || JSON.stringify(prev) !== JSON.stringify(next)) render();
  } catch (e) {
    if (e.status === 400 || e.status === 401 || e.status === 403) { store.del(); viewer = ''; state = null; renderPicker(); }
    else if (!state) offline();
  }
}

function card(it) {
  const link = safeUrl(it.url);
  const link2 = safeUrl(it.url2);
  const img = safeUrl(it.image_url);
  let status = '', action = '';
  if (it.mine) {
    status = `<div class="reserved">Reservado por ti ✓</div>`;
    action = `<div class="row"><button class="ghost" data-undo="${it.id}">desfazer reserva</button></div>`;
  } else if (it.reserved) {
    status = `<div class="reserved">Reservado ✓</div>`;
  } else if (!it.own) {
    action = `<button data-reserve="${it.id}">Reservar</button>`;
  }
  const done = !it.own && !it.mine && it.reserved;
  const stamp = !it.own && (it.reserved || it.mine) ? `<span class="stamp ${it.mine ? 'mine' : ''}">Reservado</span>` : '';
  return `
    <div class="card ${done ? 'done' : ''}">
      <div class="img">${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '🎁'}${stamp}</div>
      <div class="body">
        <div class="title">${esc(it.title)}</div>
        ${it.note ? `<div class="small">${esc(it.note)}</div>` : ''}
        ${status}
        <div class="actions">
          ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Ver na loja ↗</a>` : ''}
          ${link2 ? `<a href="${esc(link2)}" target="_blank" rel="noopener noreferrer">Ver segunda opção ↗</a>` : ''}
          ${action}
        </div>
      </div>
    </div>`;
}

function render() {
  const me = state.viewer; // 'miguel' | 'natalia' | null
  const mine = state.items.filter(i => i.mine);
  if (!tab) tab = me === 'miguel' ? 'natalia' : 'miguel'; // abre na carta do Miguel (o Miguel abre na da Natália)
  let html = '';
  html += welcomeHtml();
  html += `<div class="tabs">
      <button class="tab ${tab === 'natalia' ? 'on' : ''}" data-tab="natalia">Carta da Natália</button>
      <button class="tab ${tab === 'miguel' ? 'on' : ''}" data-tab="miguel">Carta do Miguel</button>
      <button class="tab ${tab === 'mine' ? 'on' : ''}" data-tab="mine">As minhas reservas${mine.length ? `<span class="n">${mine.length}</span>` : ''}</button>
    </div>`;

  if (tab === 'mine') {
    html += `<h2 class="list-title">As minhas reservas</h2>
      <div class="note">Só tu vês esta lista: as prendas que reservaste.</div>`;
    html += mine.length
      ? `<div class="grid">${mine.map(card).join('')}</div>`
      : `<p class="empty">Ainda não reservaste nenhuma prenda.</p>`;
    app.innerHTML = html + howHtml(); return;
  }

  html += `<div class="filters">
      <div class="chips"><button class="chip free ${onlyFree ? 'on' : ''}" data-free="1" aria-pressed="${onlyFree}">${onlyFree ? '✓ ' : ''}Só disponíveis</button></div>
    </div>`;
  {
    const owner = tab;
    const all = state.items.filter(i => i.owner === owner);
    const items = applyFilters(all);
    html += `<h2 class="list-title">Carta de Natal ${owner === 'natalia' ? 'da' : 'do'} ${NAMES[owner]}</h2>`;
    if (owner === me) html += `<div class="note">Esta é a tua carta. Para manter a surpresa, não mostramos o que já foi reservado. 🤫</div>`;
    html += items.length
      ? `<div class="grid">${items.map(card).join('')}</div>`
      : `<p class="empty">${!all.length ? 'Ainda sem prendas.' : onlyFree ? 'Já está tudo reservado! 🎄' : 'Nenhuma prenda.'}</p>`;
  }
  app.innerHTML = html + howHtml();
}

const titleOf = id => { const it = state.items.find(i => i.id === id); return it ? `«${it.title}»` : 'esta prenda'; };

app.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.pick) { viewer = t.dataset.pick; store.set(viewer); return load(); }
  if (t.id === 'refresh') return load();
  if (t.dataset.free) { onlyFree = !onlyFree; return render(); }
  if (t.dataset.tab) { tab = t.dataset.tab; return render(); }

  const rid = t.dataset.reserve, uid = t.dataset.undo;
  if (!rid && !uid) return;
  const id = rid || uid, name = titleOf(id);

  const ok = rid
    ? await ask('Reservar esta prenda?', `${name} fica marcada como reservada, sem mostrar o teu nome, para ninguém comprar o mesmo.`, 'Reservar')
    : await ask('Desfazer a reserva?', `${name} volta a ficar livre para qualquer pessoa reservar.`, 'Desfazer reserva');
  if (!ok) return;
  t.disabled = true;
  try {
    const res = await rpc('reserve_item', { p_viewer: viewer, p_item_id: id, p_reserve: !!rid });
    if (rid && !res.ok) {
      await load();
      return tell('Já não está livre', `Entretanto outra pessoa reservou ${name}. Escolhe outra prenda. 🎁`);
    }
    if (rid) { confetti(); load(); await tell('Ho ho ho! 🎅', REACT[Math.floor(Math.random() * REACT.length)]); return; }
  } catch { await tell('Não foi possível guardar', 'Tenta outra vez daqui a pouco.'); }
  load();
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && viewer && state) load(true); });
// atualiza sozinho, para ninguem reservar o que outra pessoa acabou de reservar
setInterval(() => { if (!document.hidden && viewer && state && $('modal').hidden) load(true); }, 30000);

if (viewer) load(); else renderPicker();

/* ---------- confetti ---------- */
function confetti() {
  const cols = ['#d9b779', '#b8433a', '#fbf6ee', '#1f8a5a', '#f2c94c'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
const REACT = [
  'Boa escolha! O segredo fica entre nós e os duendes. 🤫',
  'Reservado! O Pai Natal já pôs um visto na lista. ✅',
  'Excelente gosto! Agora é só embrulhar com muito carinho. 🎁',
  'Missão cumprida! As renas aprovam esta escolha. 🦌'
];

/* ---------- neve ---------- */
(function snow() {
  const canvas = $('snow');
  const ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, dpr = 1, flakes = [], sprites = [], last = 0, raf = 0;

  function sprite(r) {
    const size = r * 4, px = Math.ceil(size * dpr);
    const o = document.createElement('canvas'); o.width = o.height = px;
    const g = o.getContext('2d');
    const grd = g.createRadialGradient(px / 2, px / 2, 0, px / 2, px / 2, px / 2);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,.85)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, px, px);
    return { img: o, size };
  }

  function setup() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sprites = [1.6, 2.6, 3.8].map(sprite);
    const n = Math.min(170, Math.round((w * h) / 6500));
    flakes = Array.from({ length: n }, () => {
      const k = Math.random();
      const s = k < 0.55 ? 0 : k < 0.88 ? 1 : 2;      // mais flocos pequenos que grandes
      return {
        s, x: Math.random() * w, y: Math.random() * h,
        vy: 16 + s * 14 + Math.random() * 14,          // px/s (os grandes caem mais depressa)
        sway: 8 + Math.random() * 18, ph: Math.random() * 6.28, fr: 0.4 + Math.random() * 0.6,
        a: 0.45 + s * 0.2 + Math.random() * 0.15
      };
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const f of flakes) {
      const sp = sprites[f.s];
      ctx.globalAlpha = Math.min(f.a, 1);
      ctx.drawImage(sp.img, f.x - sp.size / 2, f.y - sp.size / 2, sp.size, sp.size);
    }
    ctx.globalAlpha = 1;
  }

  function tick(now) {
    raf = requestAnimationFrame(tick);
    const dt = Math.min((now - last) / 1000 || 0, 0.05); last = now;
    for (const f of flakes) {
      f.y += f.vy * dt;
      f.x += Math.sin(now / 1000 * f.fr + f.ph) * f.sway * dt;
      if (f.y > h + 8) { f.y = -8; f.x = Math.random() * w; }
      if (f.x < -10) f.x = w + 10; else if (f.x > w + 10) f.x = -10;
    }
    draw();
  }

  function start() { cancelAnimationFrame(raf); last = performance.now(); if (still) draw(); else raf = requestAnimationFrame(tick); }

  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { setup(); start(); }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  setup(); start();
})();
</script>
